# Cloud Run Service Configuration - Secret Service
# Deploy with: gcloud run services replace secret-service.yaml --region=europe-west10

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: secret-service
  labels:
    app: secret-service
    component: backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Cloud SQL connection
        run.googleapis.com/cloudsql-instances: cloud-secrets-manager:europe-west10:secrets-manager-db-dev-3631da18
        # Scaling configuration
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # CPU allocation
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: secret-service-dev@cloud-secrets-manager.iam.gserviceaccount.com
      containers:
        - image: europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/secret-service:dev
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,cloudrun
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql:///secrets?cloudSqlInstance=cloud-secrets-manager:europe-west10:secrets-manager-db-dev-3631da18&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secrets-manager-db-dev-secrets-user
                  key: latest
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-manager-db-dev-secrets-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: csm-jwt-secret
                  key: latest
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: csm-aes-key
                  key: latest
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/firebase/firebase-admin-key.json
            - name: GCP_PROJECT_ID
              value: cloud-secrets-manager
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          volumeMounts:
            - name: firebase-key
              mountPath: /secrets/firebase
              readOnly: true
      volumes:
        - name: firebase-key
          secret:
            secretName: csm-firebase-admin-key
            items:
              - key: latest
                path: firebase-admin-key.json

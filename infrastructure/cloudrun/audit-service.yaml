# Cloud Run Service Configuration - Audit Service
# Deploy with: gcloud run services replace audit-service.yaml --region=europe-west10

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: audit-service
  labels:
    app: audit-service
    component: backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Cloud SQL connection
        run.googleapis.com/cloudsql-instances: cloud-secrets-manager:europe-west10:secrets-manager-db-dev-3631da18
        # Scaling configuration
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # CPU allocation
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: audit-service-dev@cloud-secrets-manager.iam.gserviceaccount.com
      containers:
        - image: europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/audit-service:dev
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,cloudrun
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql:///audit?cloudSqlInstance=cloud-secrets-manager:europe-west10:secrets-manager-db-dev-3631da18&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secrets-manager-db-dev-audit-user
                  key: latest
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-manager-db-dev-audit-password
                  key: latest
            - name: AUDIT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: csm-audit-api-key
                  key: latest
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15

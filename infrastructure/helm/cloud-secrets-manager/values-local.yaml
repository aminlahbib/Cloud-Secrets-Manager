# Local Kubernetes (Minikube / Docker Desktop) Values
# Use with: helm install csm . -n cloud-secrets-manager -f values-local.yaml

# Spring profile and JPA settings for local dev
springProfile: dev
jpaDdlAuto: update

# Use locally built images
image:
  repositorySecretService: "csm/secret-service"
  repositoryAuditService: "csm/audit-service"
  repositoryNotificationService: "csm/notification-service"
  repositoryFrontend: "csm/frontend"
  tag: "local"
  pullPolicy: Never

secretService:
  replicaCount: 1
  port: 8080
  env: []
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

auditService:
  replicaCount: 1
  port: 8081
  env: []
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

notificationService:
  replicaCount: 1
  port: 8082
  env: []
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

frontend:
  replicaCount: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "100m"

# Service accounts (no GCP annotations for local)
serviceAccount:
  create: true
  annotations: {}

auditServiceAccount:
  create: true
  annotations: {}

notificationServiceAccount:
  create: true
  annotations: {}

# Create secrets locally (not using External Secrets Operator)
createSecrets: true
jwtSecret: "local-dev-jwt-secret-key-minimum-32-chars!"
aesKey: "local-dev-aes-key-32-bytes-here!"
# Must match VITE_AUDIT_API_KEY in local frontend image build (see scripts/deploy-minikube.sh LOCAL_AUDIT_API_KEY).
auditApiKey: "local-dev-audit-api-key"

# Enable local PostgreSQL
postgres:
  enabled: true
  secretsDb:
    user: secrets_user
    password: secrets_password_local
    db: secrets
    storage: 1Gi
  auditDb:
    user: audit_user
    password: audit_password_local
    db: audit
    storage: 1Gi

# Disable Cloud SQL (using local postgres)
cloudSql:
  enabled: false

# Firebase/Google Identity (disabled for local)
googleIdentity:
  enabled: false
  projectId: "cloud-secrets-manager"

# Pub/Sub disabled for local (uses HTTP fallback)
pubsub:
  enabled: false

# Email disabled for local
email:
  enabled: false

# Ingress (use port-forward for local access)
ingress:
  enabled: false

# App base URL for local
app:
  baseUrl: "http://localhost:3000"

# Monitoring integration
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

podDisruptionBudget:
  enabled: false

autoscaling:
  enabled: false

apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-service
  labels:
    {{- include "csm.labels" . | nindent 4 }}
    app.kubernetes.io/name: secret-service
spec:
  replicas: {{ .Values.secretService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-service
    spec:
      serviceAccountName: secret-service
      containers:
        - name: secret-service
          image: {{ include "csm.image" (dict "registry" .Values.global.image.registry "name" .Values.secretService.image.name "tag" .Values.global.image.tag) }}
          ports:
            - containerPort: {{ .Values.secretService.port }}
              name: http
          env:
            {{- range $k, $v := .Values.secretService.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://localhost:5432/secrets"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: secrets-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: secrets-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: aes-key
            - name: AUDIT_SERVICE_URL
              value: "http://audit-service:{{ .Values.auditService.port }}"
            - name: AUDIT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: audit-api-key
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:{{ .Values.notificationService.port }}"
            - name: GCP_PROJECT_ID
              value: {{ .Values.global.projectId | quote }}
            - name: NOTIFICATIONS_TOPIC_NAME
              value: {{ .Values.pubsub.topicName | quote }}
          resources:
            requests:
              cpu: {{ .Values.secretService.resources.requests.cpu }}
              memory: {{ .Values.secretService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.secretService.resources.limits.cpu }}
              memory: {{ .Values.secretService.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
        {{- include "csm.cloudSqlProxy" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: secret-service
  labels:
    {{- include "csm.labels" . | nindent 4 }}
    app.kubernetes.io/name: secret-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.secretService.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: secret-service

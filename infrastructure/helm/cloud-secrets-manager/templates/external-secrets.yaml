{{- if .Values.externalSecrets.enabled }}
# Database credentials — synced from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-secrets
  labels:
    {{- include "csm.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
    - secretKey: secrets-user
      remoteRef:
        key: {{ .Values.externalSecrets.sqlInstance }}-secrets-user
    - secretKey: secrets-password
      remoteRef:
        key: {{ .Values.externalSecrets.sqlInstance }}-secrets-password
    - secretKey: audit-user
      remoteRef:
        key: {{ .Values.externalSecrets.sqlInstance }}-audit-user
    - secretKey: audit-password
      remoteRef:
        key: {{ .Values.externalSecrets.sqlInstance }}-audit-password
---
# Application secrets — must be created manually in GCP Secret Manager
# Required: csm-jwt-secret, csm-aes-key, csm-audit-api-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    {{- include "csm.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: csm-jwt-secret
    - secretKey: aes-key
      remoteRef:
        key: csm-aes-key
    - secretKey: audit-api-key
      remoteRef:
        key: csm-audit-api-key
{{- end }}

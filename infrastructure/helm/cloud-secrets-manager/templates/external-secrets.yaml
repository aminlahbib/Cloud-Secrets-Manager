{{- if not .Values.createSecrets }}
# External Secrets - Syncs secrets from GCP Secret Manager
# These require the External Secrets Operator to be installed
# and a ClusterSecretStore named "gcp-secret-manager" to exist

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
  # Database credentials - names match Terraform postgresql module output
  # Format: ${instance_name}-${db_name}-{password|user}
  - secretKey: secrets-db-user
    remoteRef:
      key: secrets-manager-db-{{ .Values.environment | default "dev" }}-secrets-user
  - secretKey: secrets-db-password
    remoteRef:
      key: secrets-manager-db-{{ .Values.environment | default "dev" }}-secrets-password
  - secretKey: audit-db-user
    remoteRef:
      key: secrets-manager-db-{{ .Values.environment | default "dev" }}-audit-user
  - secretKey: audit-db-password
    remoteRef:
      key: secrets-manager-db-{{ .Values.environment | default "dev" }}-audit-password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-secrets-config
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: cloud-secrets-config
    creationPolicy: Owner
  data:
  # Application secrets - must be created in GCP Secret Manager
  - secretKey: JWT_SECRET
    remoteRef:
      key: csm-jwt-secret
  - secretKey: AES_KEY
    remoteRef:
      key: csm-aes-key

{{- if .Values.googleIdentity.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firebase-admin-key
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: firebase-admin-key
    creationPolicy: Owner
  data:
  - secretKey: firebase-admin-key.json
    remoteRef:
      key: csm-firebase-admin-key
{{- end }}

{{- if .Values.email.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sendgrid-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: sendgrid-secret
    creationPolicy: Owner
  data:
  - secretKey: SENDGRID_API_KEY
    remoteRef:
      key: csm-sendgrid-api-key
{{- end }}

{{- end }}

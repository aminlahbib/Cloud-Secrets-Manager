# Default values — overridden per environment via values-<env>.yaml
# and Terraform helm_release set {} blocks.

global:
  image:
    registry: ""      # set by Terraform (e.g. europe-west10-docker.pkg.dev/project/docker-images)
    tag: "latest"
  cloudSql:
    connectionName: "" # set by Terraform
  projectId: ""        # set by Terraform
  environment: "dev"

# -- Secret Service ---------------------------------------------------
secretService:
  replicas: 1
  image:
    name: secret-service
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    gcpEmail: "" # set by Terraform
  env:
    SPRING_PROFILES_ACTIVE: "prod,gke"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

# -- Audit Service ----------------------------------------------------
auditService:
  replicas: 1
  image:
    name: audit-service
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    gcpEmail: ""
  env:
    SPRING_PROFILES_ACTIVE: "prod,gke"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

# -- Notification Service ---------------------------------------------
notificationService:
  replicas: 1
  image:
    name: notification-service
  port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    gcpEmail: ""
  env:
    SPRING_PROFILES_ACTIVE: "prod,gke"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    EMAIL_ENABLED: "false"

# -- Frontend ---------------------------------------------------------
frontend:
  replicas: 1
  image:
    name: frontend
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Cloud SQL Auth Proxy sidecar -------------------------------------
cloudSqlProxy:
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- External Secrets -------------------------------------------------
externalSecrets:
  enabled: true
  sqlInstance: "" # set by Terraform (e.g. csm-db-dev)

# -- Pub/Sub ----------------------------------------------------------
pubsub:
  topicName: ""
  subscriptionName: ""

# -- Ingress ----------------------------------------------------------
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Environment (dev, staging, production)
environment: dev

image:
  repositorySecretService: "europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/secret-service"
  repositoryAuditService: "europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/audit-service"
  repositoryNotificationService: "europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/notification-service"
  repositoryFrontend: "europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/frontend"
  tag: "latest"
  pullPolicy: IfNotPresent

secretService:
  replicaCount: 1
  port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

auditService:
  replicaCount: 1
  port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

notificationService:
  replicaCount: 1
  port: 8082
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

frontend:
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

serviceAccount:
  create: true
  annotations:
    # Workload Identity binding for secret-service
    iam.gke.io/gcp-service-account: "secret-service-dev@cloud-secrets-manager.iam.gserviceaccount.com"
  
# Separate service account configuration for audit-service
auditServiceAccount:
  create: true
  annotations:
    # Workload Identity binding for audit-service
    iam.gke.io/gcp-service-account: "audit-service-dev@cloud-secrets-manager.iam.gserviceaccount.com"

notificationServiceAccount:
  create: true
  annotations:
    # Workload Identity binding for notification-service
    iam.gke.io/gcp-service-account: "notification-service-dev@cloud-secrets-manager.iam.gserviceaccount.com"

# Secrets Configuration
# Set to false if using External Secrets Operator (recommended for production)
createSecrets: false

# If createSecrets is true, these values will be used to create Kubernetes Secrets
# If createSecrets is false, these are ignored and you must ensure secrets exist via ESO
jwtSecret: "ignored-if-create-secrets-is-false"
aesKey: "ignored-if-create-secrets-is-false"

postgres:
  enabled: false # Disable local databases (using Cloud SQL)
  secretsDb:
    user: secrets_user  # Matches Terraform: ${db_name}_user
    # password: ignored-if-create-secrets-is-false (managed by ESO from GCP Secret Manager)
    db: secrets  # Database name in Cloud SQL
    storage: 10Gi
  auditDb:
    user: audit_user  # Matches Terraform: ${db_name}_user
    # password: ignored-if-create-secrets-is-false (managed by ESO from GCP Secret Manager)
    db: audit  # Database name in Cloud SQL
    storage: 10Gi

# Cloud SQL Configuration
# IMPORTANT: connectionName must be set during deployment using:
#   --set cloudSql.connectionName="$(terraform output -raw db_connection_name)"
# Or get it from: gcloud sql instances describe <instance-name> --format='value(connectionName)'
cloudSql:
  enabled: true
  connectionName: ""  # Required: Set via --set cloudSql.connectionName=<project:region:instance>
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Google Cloud Identity Platform Configuration
googleIdentity:
  enabled: false  # Set to true to enable Firebase authentication
  projectId: "cloud-secrets-manager"
  setupEnabled: false  # Disable setup endpoint in production after initial configuration

ingress:
  enabled: true
  className: "nginx"
  host: "secrets.local"
  tls:
    enabled: false  # Set to true when you have TLS certificates
    secretName: "secrets-manager-tls"
    # For Let's Encrypt with cert-manager, use:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  annotations:
    # No rewrite-target needed - backend services expect /api/* paths
    # Rate limiting (requests per minute per IP)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # DDoS protection
    nginx.ingress.kubernetes.io/limit-whitelist: ""  # Add trusted IPs if needed
    # Security headers (disabled SSL redirect for dev - enable in production)
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"

# Email Configuration (SendGrid)
email:
  enabled: false  # Set to true when SendGrid is configured
  fromAddress: "noreply@cloudsecrets.com"
  fromName: "Cloud Secrets Manager"

# Pub/Sub Configuration
pubsub:
  enabled: true  # Uses GCP Pub/Sub for event messaging
  topicName: "notifications-events"
  subscriptionName: "notifications-events-sub"

# Application Configuration
app:
  baseUrl: "https://secrets.local"  # Update with your domain

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
    # CORS (if needed)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://yourdomain.com"


# Cloud Build - Build all Docker images
# Usage: gcloud builds submit --config=infrastructure/ci-cd/cloudbuild-images.yaml .

steps:
  # Build Secret Service
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-secret-service'
    args:
      - 'build'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/secret-service:${_TAG}'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/secret-service:latest'
      - '-f'
      - 'apps/backend/secret-service/Dockerfile'
      - '.'
    waitFor: ['-']

  # Build Audit Service
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-audit-service'
    args:
      - 'build'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/audit-service:${_TAG}'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/audit-service:latest'
      - '-f'
      - 'apps/backend/audit-service/Dockerfile'
      - '.'
    waitFor: ['-']

  # Build Notification Service
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-notification-service'
    args:
      - 'build'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/notification-service:${_TAG}'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/notification-service:latest'
      - '-f'
      - 'apps/backend/notification-service/Dockerfile'
      - '.'
    waitFor: ['-']

  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    dir: 'apps/frontend'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_VITE_API_BASE_URL}'
      - '--build-arg'
      - 'VITE_NOTIFICATION_SERVICE_URL=${_VITE_NOTIFICATION_SERVICE_URL}'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'VITE_AUDIT_API_KEY=${_VITE_AUDIT_API_KEY}'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/frontend:${_TAG}'
      - '-t'
      - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/frontend:latest'
      - '.'
    waitFor: ['-']

substitutions:
  _TAG: 'dev'
  _VITE_API_BASE_URL: ''
  _VITE_NOTIFICATION_SERVICE_URL: ''
  # Firebase config - override via --substitutions or use Secret Manager
  # Example: gcloud builds submit --substitutions=_VITE_FIREBASE_API_KEY=$(gcloud secrets versions access latest --secret=csm-firebase-api-key)
  _VITE_FIREBASE_API_KEY: ''       # Required: Set via --substitutions
  _VITE_FIREBASE_AUTH_DOMAIN: '${PROJECT_ID}.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: '${PROJECT_ID}'
  _VITE_FIREBASE_STORAGE_BUCKET: '${PROJECT_ID}.firebasestorage.app'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: ''  # Required: Set via --substitutions
  _VITE_FIREBASE_APP_ID: ''        # Required: Set via --substitutions
  _VITE_AUDIT_API_KEY: ''          # Required: Set via --substitutions

images:
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/secret-service:${_TAG}'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/secret-service:latest'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/audit-service:${_TAG}'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/audit-service:latest'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/notification-service:${_TAG}'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/notification-service:latest'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/frontend:${_TAG}'
  - 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images/frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'

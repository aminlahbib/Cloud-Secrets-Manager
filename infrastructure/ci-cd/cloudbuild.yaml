# Cloud Build — build and push all Docker images
# Triggered by GitHub Actions or manually:
#   gcloud builds submit . --config=infrastructure/ci-cd/cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-secret-service'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/secret-service:${_TAG}'
      - '-t'
      - '${_REGISTRY}/secret-service:latest'
      - '-f'
      - 'apps/backend/secret-service/Dockerfile'
      - '.'
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-audit-service'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/audit-service:${_TAG}'
      - '-t'
      - '${_REGISTRY}/audit-service:latest'
      - '-f'
      - 'apps/backend/audit-service/Dockerfile'
      - '.'
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-notification-service'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/notification-service:${_TAG}'
      - '-t'
      - '${_REGISTRY}/notification-service:latest'
      - '-f'
      - 'apps/backend/notification-service/Dockerfile'
      - '.'
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    dir: 'apps/frontend'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_VITE_API_BASE_URL}'
      - '--build-arg'
      - 'VITE_SECRET_SERVICE_URL=${_VITE_SECRET_SERVICE_URL}'
      - '--build-arg'
      - 'VITE_AUDIT_SERVICE_URL=${_VITE_AUDIT_SERVICE_URL}'
      - '--build-arg'
      - 'VITE_NOTIFICATION_SERVICE_URL=${_VITE_NOTIFICATION_SERVICE_URL}'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'VITE_AUDIT_API_KEY=${_VITE_AUDIT_API_KEY}'
      - '-t'
      - '${_REGISTRY}/frontend:${_TAG}'
      - '-t'
      - '${_REGISTRY}/frontend:latest'
      - '.'
    waitFor: ['-']

substitutions:
  _TAG: 'latest'
  _REGISTRY: 'europe-west10-docker.pkg.dev/${PROJECT_ID}/docker-images'
  _VITE_API_BASE_URL: ''
  _VITE_SECRET_SERVICE_URL: ''
  _VITE_AUDIT_SERVICE_URL: ''
  _VITE_NOTIFICATION_SERVICE_URL: ''
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: ''
  _VITE_FIREBASE_PROJECT_ID: ''
  _VITE_FIREBASE_STORAGE_BUCKET: ''
  _VITE_FIREBASE_MESSAGING_SENDER_ID: ''
  _VITE_FIREBASE_APP_ID: ''
  _VITE_AUDIT_API_KEY: ''

images:
  - '${_REGISTRY}/secret-service:${_TAG}'
  - '${_REGISTRY}/secret-service:latest'
  - '${_REGISTRY}/audit-service:${_TAG}'
  - '${_REGISTRY}/audit-service:latest'
  - '${_REGISTRY}/notification-service:${_TAG}'
  - '${_REGISTRY}/notification-service:latest'
  - '${_REGISTRY}/frontend:${_TAG}'
  - '${_REGISTRY}/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

timeout: '1800s'

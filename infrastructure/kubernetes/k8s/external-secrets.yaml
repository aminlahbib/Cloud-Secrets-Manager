apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: cloud-secrets-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
  # Database credentials - names match Terraform postgresql module output
  # Format: ${instance_name}-${db_name}-{password|user}
  - secretKey: secrets-db-user
    remoteRef:
      key: secrets-manager-db-dev-secrets-user
  - secretKey: secrets-db-password
    remoteRef:
      key: secrets-manager-db-dev-secrets-password
  - secretKey: audit-db-user
    remoteRef:
      key: secrets-manager-db-dev-audit-user
  - secretKey: audit-db-password
    remoteRef:
      key: secrets-manager-db-dev-audit-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-secrets-config
  namespace: cloud-secrets-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: cloud-secrets-config
    creationPolicy: Owner
  data:
  # Application secrets - must be created manually in GCP Secret Manager
  - secretKey: JWT_SECRET
    remoteRef:
      key: csm-jwt-secret
  - secretKey: AES_KEY
    remoteRef:
      key: csm-aes-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firebase-admin-key
  namespace: cloud-secrets-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: firebase-admin-key
    creationPolicy: Owner
  data:
  - secretKey: firebase-admin-key.json
    remoteRef:
      key: csm-firebase-admin-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sendgrid-secret
  namespace: cloud-secrets-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: sendgrid-secret
    creationPolicy: Owner
  data:
  - secretKey: SENDGRID_API_KEY
    remoteRef:
      key: csm-sendgrid-api-key


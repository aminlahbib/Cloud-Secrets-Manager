apiVersion: apps/v1
kind: Deployment
metadata:
  name: csm-notification-service
  namespace: cloud-secrets-manager
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: notifications
    app.kubernetes.io/part-of: cloud-secrets-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
      app.kubernetes.io/component: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: notifications
        app.kubernetes.io/part-of: cloud-secrets-manager
    spec:
      serviceAccountName: notification-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "cloud-secrets-manager:europe-west10:secrets-manager-db-dev-3631da18"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "64Mi"
              cpu: "30m"
            limits:
              memory: "128Mi"
              cpu: "100m"

        - name: notification-service
          image: europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images/notification-service:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://127.0.0.1:5432/secrets?sslmode=disable
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: csm-db-secrets
                  key: secrets-db-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: csm-db-secrets
                  key: secrets-db-password
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: csm-app-config
                  key: JWT_SECRET
                  optional: true
            - name: GCP_PROJECT_ID
              value: "cloud-secrets-manager"
            - name: EMAIL_ENABLED
              value: "false"
            - name: APP_BASE_URL
              value: "https://secrets.local"
          ports:
            - containerPort: 8082
              name: http
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: csm-notification-service
  namespace: cloud-secrets-manager
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: notifications
    app.kubernetes.io/part-of: cloud-secrets-manager
spec:
  selector:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: notifications
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  type: ClusterIP

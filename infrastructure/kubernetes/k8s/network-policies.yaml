---
# Default deny all ingress traffic.
# With this in place, only pods matched by an explicit allow policy receive traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: cloud-secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress to secret-service from the ingress controller,
# from notification-service (HTTP fallback), and from audit-service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-secret-service
  namespace: cloud-secrets-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secret-service
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit-service
      ports:
        - protocol: TCP
          port: 8080

---
# Allow ingress to audit-service from secret-service (audit logging)
# and from the ingress controller (proxy endpoint).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-audit-service
  namespace: cloud-secrets-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit-service
      app.kubernetes.io/component: audit-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: secret-service
      ports:
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081

---
# Allow ingress to notification-service from secret-service (HTTP fallback)
# and from the ingress controller (SSE stream + notification API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-notification-service
  namespace: cloud-secrets-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-service
      app.kubernetes.io/component: notifications
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: secret-service
      ports:
        - protocol: TCP
          port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8082

---
# Allow ingress to frontend from the ingress controller only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: cloud-secrets-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---
# Egress: DNS, GCE metadata (Workload Identity), Google APIs,
# Cloud SQL Proxy (pod-local), and inter-service within namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-essential
  namespace: cloud-secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # GCE metadata server (Workload Identity token exchange)
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    # HTTPS to Google APIs (Secret Manager, Cloud SQL, Pub/Sub, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Cloud SQL Proxy sidecar (localhost inside the pod)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Inter-service within this namespace
    - to:
        - namespaceSelector:
            matchLabels:
              name: cloud-secrets-manager
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082

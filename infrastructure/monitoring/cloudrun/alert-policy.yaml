# Cloud Monitoring Alert Policies for Cloud Run Services
# Deploy with: gcloud alpha monitoring policies create --policy-from-file=alert-policy.yaml

# Alert Policy 1: High Error Rate
- displayName: "Cloud Run - High Error Rate"
  conditions:
    - displayName: "Error rate > 5%"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" resource.labels.service_name=~"secret-service|audit-service|notification-service|frontend" metric.type="run.googleapis.com/request_count" metric.labels.response_code_class=~"5xx"'
        aggregations:
          - alignmentPeriod: "300s"
            perSeriesAligner: "ALIGN_RATE"
            crossSeriesReducer: "REDUCE_SUM"
        comparison: "COMPARISON_GT"
        thresholdValue: 0.05
        duration: "300s"
  notificationChannels: []
  alertStrategy:
    autoClose: "1800s"
    notificationRateLimit:
      period: "300s"

# Alert Policy 2: High Latency (p95 > 2s)
- displayName: "Cloud Run - High Latency"
  conditions:
    - displayName: "p95 latency > 2000ms"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" resource.labels.service_name=~"secret-service|audit-service|notification-service|frontend" metric.type="run.googleapis.com/request_latencies"'
        aggregations:
          - alignmentPeriod: "300s"
            perSeriesAligner: "ALIGN_DELTA"
            crossSeriesReducer: "REDUCE_PERCENTILE_95"
        comparison: "COMPARISON_GT"
        thresholdValue: 2000
        duration: "300s"
  notificationChannels: []
  alertStrategy:
    autoClose: "1800s"
    notificationRateLimit:
      period: "300s"

# Alert Policy 3: High Memory Usage (>80%)
- displayName: "Cloud Run - High Memory Usage"
  conditions:
    - displayName: "Memory usage > 80%"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" resource.labels.service_name=~"secret-service|audit-service|notification-service|frontend" metric.type="run.googleapis.com/container/memory/utilizations"'
        aggregations:
          - alignmentPeriod: "300s"
            perSeriesAligner: "ALIGN_MEAN"
            crossSeriesReducer: "REDUCE_MEAN"
        comparison: "COMPARISON_GT"
        thresholdValue: 0.8
        duration: "300s"
  notificationChannels: []
  alertStrategy:
    autoClose: "1800s"
    notificationRateLimit:
      period: "300s"

# Alert Policy 4: Service Unavailable
- displayName: "Cloud Run - Service Unavailable"
  conditions:
    - displayName: "No requests for 5 minutes"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" resource.labels.service_name=~"secret-service|audit-service|notification-service|frontend" metric.type="run.googleapis.com/request_count"'
        aggregations:
          - alignmentPeriod: "300s"
            perSeriesAligner: "ALIGN_RATE"
            crossSeriesReducer: "REDUCE_SUM"
        comparison: "COMPARISON_LT"
        thresholdValue: 0.01
        duration: "300s"
  notificationChannels: []
  alertStrategy:
    autoClose: "1800s"
    notificationRateLimit:
      period: "300s"

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: csm
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname postgres <<-EOSQL
      CREATE DATABASE secrets;
      CREATE DATABASE audit;
      CREATE USER ${SECRETS_USER} WITH PASSWORD '${SECRETS_PASSWORD}';
      CREATE USER ${AUDIT_USER} WITH PASSWORD '${AUDIT_PASSWORD}';
      GRANT ALL PRIVILEGES ON DATABASE secrets TO ${SECRETS_USER};
      GRANT ALL PRIVILEGES ON DATABASE audit TO ${AUDIT_USER};
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname secrets <<-EOSQL
      GRANT ALL ON SCHEMA public TO ${SECRETS_USER};
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname audit <<-EOSQL
      GRANT ALL ON SCHEMA public TO ${AUDIT_USER};
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: csm
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cloud-secrets-manager
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: csm
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cloud-secrets-manager
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-root
                  key: password
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: SECRETS_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: secrets-user
            - name: SECRETS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: secrets-password
            - name: AUDIT_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: audit-user
            - name: AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: audit-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

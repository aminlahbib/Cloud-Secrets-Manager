# ServiceMonitors for the minikube deployment.
# The Helm chart labels Services with `app.kubernetes.io/name: <svc>`,
# so the ServiceMonitor selector matches on that label (the ones under
# infrastructure/monitoring/servicemonitors/ use the legacy `app:` label
# and are kept for reference only).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: secret-service
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-service
  namespaceSelector:
    matchNames: [csm]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - targetLabel: job
          replacement: secret-service
---

name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-west10
  GKE_CLUSTER: csm-cluster-dev
  APP_NAMESPACE: csm-dev
  REGISTRY: europe-west10-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docker-images

jobs:
  # ---------------------------------------------------------------
  # Build and test
  # ---------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test Secret Service
        run: ./mvnw clean verify
        working-directory: apps/backend/secret-service

      - name: Test Audit Service
        run: ./mvnw clean verify
        working-directory: apps/backend/audit-service

      - name: Test Notification Service
        run: ./mvnw clean verify
        working-directory: apps/backend/notification-service

  # ---------------------------------------------------------------
  # Security scan
  # ---------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------
  # Build Docker images via Cloud Build
  # ---------------------------------------------------------------
  build-images:
    name: Build Images
    needs: [build-test, security-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Compute image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build images with Cloud Build
        run: |
          gcloud builds submit . \
            --config=infrastructure/ci-cd/cloudbuild.yaml \
            --substitutions=_TAG=${{ steps.tag.outputs.TAG }} \
            --project=${{ env.GCP_PROJECT_ID }}

  # ---------------------------------------------------------------
  # Deploy to GKE (dev) — triggered by push to development
  # ---------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: build-images
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy via Helm
        run: |
          helm upgrade csm \
            infrastructure/helm/cloud-secrets-manager \
            --namespace ${{ env.APP_NAMESPACE }} \
            --reuse-values \
            --set global.image.tag=${{ needs.build-images.outputs.image_tag }} \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/secret-service -n ${{ env.APP_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/audit-service -n ${{ env.APP_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/notification-service -n ${{ env.APP_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.APP_NAMESPACE }} --timeout=120s
          echo "--- Pod Status ---"
          kubectl get pods -n ${{ env.APP_NAMESPACE }}

  # ---------------------------------------------------------------
  # Deploy to GKE (production) — triggered by push to main
  # ---------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: build-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy via Helm
        run: |
          helm upgrade csm \
            infrastructure/helm/cloud-secrets-manager \
            --namespace ${{ env.APP_NAMESPACE }} \
            --reuse-values \
            --set global.image.tag=${{ needs.build-images.outputs.image_tag }} \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/secret-service -n ${{ env.APP_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/audit-service -n ${{ env.APP_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/notification-service -n ${{ env.APP_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.APP_NAMESPACE }} --timeout=120s
          echo "--- Pod Status ---"
          kubectl get pods -n ${{ env.APP_NAMESPACE }}

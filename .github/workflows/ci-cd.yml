name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:  # Allow manual triggering

env:
  GCP_PROJECT_ID: cloud-secrets-manager
  GCP_REGION: europe-west10
  ARTIFACT_REGISTRY: europe-west10-docker.pkg.dev
  IMAGE_REGISTRY: europe-west10-docker.pkg.dev/cloud-secrets-manager/docker-images

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Test Secret Service
        run: |
          cd apps/backend/secret-service
          ./mvnw clean verify
        continue-on-error: false

      - name: Build and Test Audit Service
        run: |
          cd apps/backend/audit-service
          ./mvnw clean verify
        continue-on-error: false

      - name: Build and Test Notification Service
        run: |
          cd apps/backend/notification-service
          ./mvnw clean verify
        continue-on-error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/backend/*/target/surefire-reports/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-images:
    name: Build Docker Images
    needs: [build-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set image tag
        id: tags
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "ENV=prod" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "ENV=dev" >> $GITHUB_OUTPUT
          fi

      - name: Load secrets from Secret Manager
        id: secrets
        run: |
          FIREBASE_API_KEY=$(gcloud secrets versions access latest --secret=csm-firebase-api-key --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "")
          FIREBASE_MESSAGING_SENDER_ID=$(gcloud secrets versions access latest --secret=csm-firebase-messaging-sender-id --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "")
          FIREBASE_APP_ID=$(gcloud secrets versions access latest --secret=csm-firebase-app-id --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "")
          AUDIT_API_KEY=$(gcloud secrets versions access latest --secret=csm-audit-api-key --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "")
          
          echo "FIREBASE_API_KEY=${FIREBASE_API_KEY}" >> $GITHUB_ENV
          echo "FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}" >> $GITHUB_ENV
          echo "FIREBASE_APP_ID=${FIREBASE_APP_ID}" >> $GITHUB_ENV
          echo "AUDIT_API_KEY=${AUDIT_API_KEY}" >> $GITHUB_ENV

      - name: Build images with Cloud Build
        run: |
          gcloud builds submit . \
            --config=infrastructure/ci-cd/cloudbuild-images.yaml \
            --substitutions=_TAG=${{ steps.tags.outputs.IMAGE_TAG }},_VITE_API_BASE_URL=,_VITE_NOTIFICATION_SERVICE_URL=,_VITE_FIREBASE_API_KEY="${FIREBASE_API_KEY}",_VITE_FIREBASE_AUTH_DOMAIN="${{ env.GCP_PROJECT_ID }}.firebaseapp.com",_VITE_FIREBASE_PROJECT_ID="${{ env.GCP_PROJECT_ID }}",_VITE_FIREBASE_STORAGE_BUCKET="${{ env.GCP_PROJECT_ID }}.firebasestorage.app",_VITE_FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID}",_VITE_FIREBASE_APP_ID="${FIREBASE_APP_ID}",_VITE_AUDIT_API_KEY="${AUDIT_API_KEY}" \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Images built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images:" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Service: \`${{ env.IMAGE_REGISTRY }}/secret-service:${{ steps.tags.outputs.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Audit Service: \`${{ env.IMAGE_REGISTRY }}/audit-service:${{ steps.tags.outputs.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Notification Service: \`${{ env.IMAGE_REGISTRY }}/notification-service:${{ steps.tags.outputs.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.IMAGE_REGISTRY }}/frontend:${{ steps.tags.outputs.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: \`${{ steps.tags.outputs.ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Git SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy to Dev
    needs: build-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: dev
      url: https://console.cloud.google.com/run?project=${{ env.GCP_PROJECT_ID }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set image tag
        id: tags
        run: |
          echo "IMAGE_TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud builds submit . \
            --config=infrastructure/ci-cd/cloudbuild-deploy-cloudrun.yaml \
            --substitutions=_ENV=dev,_IMAGE_TAG=${{ steps.tags.outputs.IMAGE_TAG }},_CLOUD_SQL_INSTANCE=secrets-manager-db-dev-3631da18 \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Get service URLs
        id: urls
        run: |
          SECRET_URL=$(gcloud run services describe secret-service \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          AUDIT_URL=$(gcloud run services describe audit-service \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          NOTIFICATION_URL=$(gcloud run services describe notification-service \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          FRONTEND_URL=$(gcloud run services describe frontend \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          
          echo "SECRET_URL=${SECRET_URL}" >> $GITHUB_OUTPUT
          echo "AUDIT_URL=${AUDIT_URL}" >> $GITHUB_OUTPUT
          echo "NOTIFICATION_URL=${NOTIFICATION_URL}" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=${FRONTEND_URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment to Dev Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Service: ${{ steps.urls.outputs.SECRET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Audit Service: ${{ steps.urls.outputs.AUDIT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Notification Service: ${{ steps.urls.outputs.NOTIFICATION_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ steps.urls.outputs.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          gcloud run services list --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format="table(metadata.name,status.url,status.conditions[0].status)" >> $GITHUB_STEP_SUMMARY || true

  deploy-prod:
    name: Deploy to Production
    needs: build-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://console.cloud.google.com/run?project=${{ env.GCP_PROJECT_ID }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set image tag
        id: tags
        run: |
          echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud builds submit . \
            --config=infrastructure/ci-cd/cloudbuild-deploy-cloudrun.yaml \
            --substitutions=_ENV=prod,_IMAGE_TAG=${{ steps.tags.outputs.IMAGE_TAG }},_CLOUD_SQL_INSTANCE=secrets-manager-db-prod \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Get service URLs
        id: urls
        run: |
          SECRET_URL=$(gcloud run services describe secret-service \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          AUDIT_URL=$(gcloud run services describe audit-service \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          NOTIFICATION_URL=$(gcloud run services describe notification-service \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          FRONTEND_URL=$(gcloud run services describe frontend \
            --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "N/A")
          
          echo "SECRET_URL=${SECRET_URL}" >> $GITHUB_OUTPUT
          echo "AUDIT_URL=${AUDIT_URL}" >> $GITHUB_OUTPUT
          echo "NOTIFICATION_URL=${NOTIFICATION_URL}" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=${FRONTEND_URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment to Production Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Service: ${{ steps.urls.outputs.SECRET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Audit Service: ${{ steps.urls.outputs.AUDIT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Notification Service: ${{ steps.urls.outputs.NOTIFICATION_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ steps.urls.outputs.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          gcloud run services list --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} --format="table(metadata.name,status.url,status.conditions[0].status)" >> $GITHUB_STEP_SUMMARY || true
